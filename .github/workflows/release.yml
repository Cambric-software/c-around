name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Android (primary) ──────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build universal APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Build split APKs (arm64, arm, x64)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk            android.apk
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  android-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk android-arm.apk  || true
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk     android-x64.apk   || true

      - name: Checksums
        run: |
          sha256sum android.apk       > android.apk.sha256
          sha256sum android-arm64.apk > android-arm64.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android.apk
            android.apk.sha256
            android-arm64.apk
            android-arm64.apk.sha256
            android-arm.apk
            android-x64.apk

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $src = "app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$src/*" -DestinationPath windows.zip
          $hash = (Get-FileHash windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  windows.zip" | Out-File -FilePath windows.zip.sha256 -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            windows.zip
            windows.zip.sha256

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux
        working-directory: app
        run: flutter build linux --release

      - name: Package
        run: |
          tar -czf linux.tar.gz -C app/build/linux/x64/release/bundle .
          sha256sum linux.tar.gz > linux.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            linux.tar.gz
            linux.tar.gz.sha256

  # ── Publish release ────────────────────────────────────────────────────────
  release:
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: List artifacts
        run: find release-files -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## C Around ${{ github.ref_name }}

            Download the app for your platform. Android is the recommended platform.

            **Download page:** https://cambric-software.github.io/c-around/

            ### Android
            - `android.apk` — universal APK (arm64, recommended for most phones)
            - `android-arm64.apk` — arm64-v8a only (smaller)
            - Verify: `sha256sum android.apk` and compare with `android.apk.sha256`

            ### Windows
            - `windows.zip` — extract and run `c_around.exe`

            ### Linux
            - `linux.tar.gz` — extract and run `c_around`

            All builds pass `flutter analyze` (no issues) and 146 tests.
          files: |
            release-files/android/android.apk
            release-files/android/android.apk.sha256
            release-files/android/android-arm64.apk
            release-files/android/android-arm64.apk.sha256
            release-files/windows/windows.zip
            release-files/windows/windows.zip.sha256
            release-files/linux/linux.tar.gz
            release-files/linux/linux.tar.gz.sha256
