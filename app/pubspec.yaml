name: cambric_app
description: C Around — offline accessibility companion that explains the world around you.
publish_to: "none"
version: 1.0.9+10

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.1

  # Cambric shared design system.
  cambric_design:
    path: ../packages/cambric_design

  # Storage and platform plumbing.
  path_provider: ^2.1.4
  shared_preferences: ^2.5.3
  http: ^1.2.2
  crypto: ^3.0.6
  logging: ^1.3.0
  path: ^1.9.0
  archive: ^4.0.0

  # Local database.
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4

  # Camera and sensors.
  camera: ^0.11.1
  camera_windows: ^0.2.6
  image_picker: ^1.1.2
  sensors_plus: ^6.1.1
  geolocator: ^13.0.2

  # On-device inference.
  onnxruntime: ^1.4.1
  record: ^6.1.2
  sherpa_onnx: ^1.12.14
  image: ^4.5.4

  # Output channels: speech, sound, vibration, screen wake.
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  vibration: ^3.1.0
  wakelock_plus: ^1.2.10
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Force sqflite_android to 2.4.5+1 — 2.4.6 uses VERSION_CODES.BAKLAVA
# (Android SDK 36) and Thread.threadId() (Java 19) which are unavailable
# in the current build environment.
dependency_overrides:
  sqflite_android: 2.4.4

flutter:
  generate: true          # enables flutter gen-l10n
  uses-material-design: true
  assets:
    - lib/core/config/cambric_config.json
    - assets/branding/icon-512.png
    - assets/models/yolov8n.onnx
    - assets/models/yamnet.onnx
    - assets/models/yamnet_class_map.csv
    - assets/models/det_500m.onnx
    - assets/models/w600k_mbf.onnx
    - assets/audio/alarm.wav
